    { term: '2026년 커피 브랜드 행사 논란', body: '그해 5월 18일 진행된 텀블러 행사의 "탱크데이", "책상에 탁" 문구가 위 두 사건을 연상시킨다는 비판을 받았고, 회사는 사과했습니다. 야구장 구호는 이 논란을 가져와 상대를 놀리는 데 쓴 것이었습니다.' },
    { term: '고교야구 응원 구호 논란 (2026)', body: '경기 중 나온 구호가 5·18을 조롱한 것으로 해석되며 논란이 됐고, 학교와 학생은 사과·방문·참배 등으로 이어졌습니다. 이 일은 학교 응원 문화 전반을 되돌아보는 계기가 됐습니다.' },
    { term: '핵심은 "말이 가리키는 것"', body: '문제는 응원 자체가 아니라, 그 말이 실존하는 비극과 피해자를 가리켰다는 데 있습니다. 의도가 무엇이었든, 상처받은 사람이 있었다는 사실은 남습니다.' }
  ];

  // ─── 게임 상태 ───
  var initial = { studentInfo: { grade: '', class: '', num: '', name: '' }, currentStage: 0, log: [], currentChoice: null, chatTurnDone: false, startTime: null };
  var state = JSON.parse(JSON.stringify(initial));

  // ═══════════════ 유틸 ═══════════════
  function checkProfanity(text) {
    var c = text.replace(/[\s.,~!@#$%^&*()_+|<>?:{}]/g, '');
    return /시발|씨발|ㅅㅂ|좆|ㅈㄲ|개새|병신|ㅂㅅ|존나|ㅈㄴ|썅|새끼|느금마|애미|애비|미친놈|미친년/.test(c);
  }
  function checkSincerity(text) {
    var c = text.replace(/\s/g, '');
    if (c.length <= 3) return false;
    var lazy = ['아니', '아냐', '몰라', '그냥', '어쩌라', '글쎄', 'ㅇㅁㄴㄹ', '응', '어', 'ㅋㅋ', 'ㅋㅋㅋ', '됐어', '없어', '패스'];
    if (!/[가-힣]/.test(text)) return false;
    if (/^[ㄱ-ㅎㅏ-ㅣ\s]+$/.test(text)) return false;
    if (lazy.indexOf(c) !== -1) return false;
    return true;
  }
  function showWarn(msg) {
    var w = $('hwt-warn-popup');
    w.textContent = msg; w.style.display = 'block';
    setTimeout(function () { w.style.display = 'none'; }, 2400);
  }

  // ─── 타이틀 설명 ───
  var TITLE_DESC =
    '2026년, 한 고교야구 경기에서 나온 <strong>응원 구호</strong>가 큰 논란이 됐습니다. ' +
    '"탱크데이", "스타벅스 가야지" 같은 말이 5·18 민주화운동을 조롱한 것으로 받아들여졌기 때문입니다.<br><br>' +
    '이 게임은 <strong>누구를 비난하거나 편을 나누기 위한 것이 아닙니다.</strong> ' +
    '그 구호가 어떤 역사를 가리키는지, 그리고 <em>왜 어떤 말은 누군가에게 상처가 되는지</em>를 ' +
    '여러분이 <strong>스스로 조사하고 이해</strong>해 보기 위한 것입니다.<br><br>' +
    '6번의 짧은 조사를 하며, 매번 <strong>내 생각을 직접 한두 문장</strong>으로 적게 됩니다. 정답은 없습니다.';

  var NEUTRAL_NOTE =
    '이 활동은 특정 정당·인물·집단을 지지하거나 비판하지 않습니다. ' +
    '다룬 내용은 교과서와 법으로 확립된 역사적 사실, 그리고 공개 보도된 사건에 한합니다. ' +
    '처벌 수위 등 사회적으로 의견이 갈리는 부분은 "여러 시각이 있다"고만 소개합니다. 여러분의 응답에는 옳고 그름의 점수가 매겨지지 않습니다.';

  // ─── 학생정보 검증 ───
  function checkFormReady() {
    var g = $('hwt-info-grade').value.trim(), c = $('hwt-info-class').value.trim();
    var n = $('hwt-info-num').value.trim(), name = $('hwt-info-name').value.trim();
    $('hwt-btn-start').disabled = !(g && c && n && name);
  }

  // ─── 시작 ───
  function startGame() {
    state.studentInfo = {
      grade: $('hwt-info-grade').value.trim(), class: $('hwt-info-class').value.trim(),
      num: $('hwt-info-num').value.trim(), name: $('hwt-info-name').value.trim()
    };
    state.startTime = new Date();
    $('hwt-screen-title').style.display = 'none';
    $('hwt-screen-game').style.display = 'block';
    buildProgress();
    renderStage();
    ROOT.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ─── 진행 표시 ───
  function buildProgress() {
    var box = $('hwt-progress-marks'); clearNode(box);
    STAGES.forEach(function (s, i) {
      var mk = makeEl('div', 'pmark'); mk.setAttribute('data-mark', String(i));
      mk.appendChild(makeEl('span', 'pmark-dot'));
      mk.appendChild(makeEl('span', 'pmark-label', '조사 ' + (i + 1)));
      box.appendChild(mk);
    });
  }
  function updateProgress() {
    var marks = ROOT.querySelectorAll('.pmark');
    for (var i = 0; i < marks.length; i++) {
      marks[i].classList.remove('done', 'active');
      if (i < state.currentStage) marks[i].classList.add('done');
      else if (i === state.currentStage) marks[i].classList.add('active');
    }
  }

  // ─── 자료 카드 ───
  function renderSourceCard() {
    var src = SOURCE_CARDS[state.currentStage]; if (!src) return;
    $('hwt-source-kicker').textContent = src.kicker;
    $('hwt-source-quote').textContent = src.quote;
    var attr = $('hwt-source-attr'); clearNode(attr);
    attr.appendChild(makeEl('strong', null, src.source));
    if (src.note) attr.appendChild(document.createTextNode(' · ' + src.note));
  }

  // ─── 씬 렌더 ───
  function renderStage() {
    var stage = STAGES[state.currentStage];
    state.currentChoice = null; state.chatTurnDone = false;
    updateProgress(); renderSourceCard();
    $('hwt-progress-turn').textContent = '조사 ' + stage.id + ' / ' + STAGES.length;
    $('hwt-scene-day').textContent = stage.day;
    $('hwt-scene-title').textContent = stage.title;
    $('hwt-scene-place').textContent = stage.place;
    renderFormatted($('hwt-scene-text'), stage.text);

    var choicesEl = $('hwt-choices'); clearNode(choicesEl);
    stage.choices.forEach(function (c, idx) {
      var btn = makeEl('button', 'choice-btn');
      btn.appendChild(makeEl('span', 'choice-num', c.num));
      var body = makeEl('span', 'choice-body');
      body.appendChild(makeEl('span', 'choice-text', c.text));
      body.appendChild(makeEl('span', 'choice-hint', c.hint));
      btn.appendChild(body);
      btn.addEventListener('click', function () { selectChoice(idx); });
      choicesEl.appendChild(btn);
    });

    $('hwt-chat-section').classList.remove('active');
    clearNode($('hwt-chat-messages'));
    var ci = $('hwt-chat-input');
    ci.value = ''; ci.disabled = false; ci.style.height = 'auto';
    $('hwt-btn-send').disabled = true;
    $('hwt-chat-tip').style.display = 'none';
    $('hwt-kw-hint').style.display = 'none';
    $('hwt-btn-next').classList.add('hidden');
    $('hwt-chat-header').textContent = '이야기 나누기 — ' + stage.persona;
  }

  // ─── 선택 ───
  function selectChoice(idx) {
    if (state.chatTurnDone) return;
    state.currentChoice = idx;
    var btns = ROOT.querySelectorAll('.choice-btn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('selected', i === idx);

    var stage = STAGES[state.currentStage];
    var choice = stage.choices[idx];

    $('hwt-chat-section').classList.add('active');
    clearNode($('hwt-chat-messages'));
    addBubble('ai', stage.opening, stage.persona);

    var kwBox = $('hwt-kw-hint');
    if (choice.keywords && choice.keywords.length) {
      clearNode(kwBox);
      kwBox.appendChild(makeEl('span', 'kw-hint-label', '💡 이런 낱말을 넣어 문장으로 적어 보세요'));
      choice.keywords.forEach(function (k) { kwBox.appendChild(makeEl('span', 'kw-chip', k)); });
      kwBox.appendChild(makeEl('div', 'kw-note', '꼭 이 낱말이 아니어도 괜찮아요. 중요한 건 "내 생각"과 "그 이유"예요.'));
      kwBox.style.display = 'block';
    } else { kwBox.style.display = 'none'; }

    if (state.currentStage === 0) {
      var tip = $('hwt-chat-tip'); clearNode(tip);
      tip.appendChild(makeEl('strong', null, '이렇게 적어보세요. '));
      tip.appendChild(document.createTextNode('"나는 ~라고 생각한다. 왜냐하면 ~ 때문이다." 처럼, 생각과 이유를 함께 적으면 좋아요.'));
      tip.style.display = 'block';
    }

    $('hwt-chat-input').focus();
    setTimeout(function () { $('hwt-chat-section').scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);
  }

  // ─── 말풍선 ───
  function addBubble(who, content, persona) {
    var box = $('hwt-chat-messages');
    var div = makeEl('div', 'bubble ' + (who === 'ai' ? 'ai-msg' : 'user-msg'));
    if (who === 'ai') {
      div.appendChild(makeEl('span', 'ai-tag', persona || '길잡이'));
      var body = document.createElement('span');
      renderFormatted(body, content);
      div.appendChild(body);
    } else {
      var parts = String(content).split('\n');
      for (var i = 0; i < parts.length; i++) {
        if (i > 0) div.appendChild(document.createElement('br'));
        div.appendChild(document.createTextNode(parts[i]));
      }
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  // ─── 전송 ───
  function sendReason() {
    var input = $('hwt-chat-input');
    var text = input.value.trim();
    if (!text) return;

    if (checkProfanity(text)) { showWarn('🚨 거친 표현이 감지되어 전송되지 않았어요.'); return; }
    if (!checkSincerity(text)) {
      addBubble('user', text);
      input.value = ''; input.style.height = 'auto';
      setTimeout(function () {
        addBubble('ai', '조금만 더 들려줄래? <strong>완성된 문장</strong>으로, 네 생각과 그 이유를 한두 줄로 적어 주면 좋겠어. 정답은 없으니 편하게.', STAGES[state.currentStage].persona);
        input.focus();
      }, 600);
      return;
    }

    var stage = STAGES[state.currentStage];
    var choice = stage.choices[state.currentChoice];

    addBubble('user', text);
    input.value = ''; input.style.height = 'auto';
    $('hwt-btn-send').disabled = true; input.disabled = true;
    $('hwt-chat-tip').style.display = 'none';
    $('hwt-kw-hint').style.display = 'none';

    var box = $('hwt-chat-messages');
    var typing = makeEl('div', 'bubble ai-msg');
    typing.setAttribute('data-typing', '1');
    for (var d = 0; d < 3; d++) typing.appendChild(makeEl('span', 'typing-dot'));
    box.appendChild(typing); box.scrollTop = box.scrollHeight;

    setTimeout(function () {
      var t = ROOT.querySelector('[data-typing]');
      if (t) t.parentNode.removeChild(t);
      var reply = stage.followup(text, state.currentStage);
      addBubble('ai', reply, stage.persona);

      state.log.push({
        stageId: stage.id, day: stage.day, title: stage.title,
        choiceIdx: state.currentChoice, choiceText: choice.text,
        reasonText: text, aiReply: reply
      });

      state.chatTurnDone = true; input.disabled = true;
      var btnNext = $('hwt-btn-next');
      btnNext.classList.remove('hidden');
      btnNext.textContent = state.currentStage === STAGES.length - 1 ? '조사를 마치고 정리하기' : '다음 조사로';
      setTimeout(function () { btnNext.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);
    }, 1000);
  }

  // ─── 다음 ───
  function proceedToNext() {
    try { sessionStorage.setItem('hwt_state', JSON.stringify(state)); } catch (e) {}
    if (state.currentStage >= STAGES.length - 1) { showResult(); return; }
    state.currentStage++;
    renderStage();
    ROOT.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ─── 결과 ───
  function showResult() {
    $('hwt-screen-game').style.display = 'none';
    $('hwt-screen-result').style.display = 'block';
    $('hwt-result-title').textContent = EPILOGUE.title;
    $('hwt-result-desc').textContent = EPILOGUE.desc;

    var factBox = $('hwt-fact-body'); clearNode(factBox);
    FACTS.forEach(function (f) {
      var row = makeEl('div', 'fact-row');
      row.appendChild(makeEl('div', 'fact-term', f.term));
      row.appendChild(makeEl('div', 'fact-body', f.body));
      factBox.appendChild(row);
    });

    var logBox = $('hwt-log-body'); clearNode(logBox);
    state.log.forEach(function (l, i) {
      var item = makeEl('div', 'log-item');
      item.appendChild(makeEl('div', 'log-stage', '조사 ' + (i + 1) + ' · ' + l.title));
      item.appendChild(makeEl('div', 'log-choice', '선택: ' + l.choiceText));
      item.appendChild(makeEl('div', 'log-reason', '내 생각: ' + (l.reasonText || '')));
      logBox.appendChild(item);
    });

    var help = $('hwt-helpline'); clearNode(help);
    help.appendChild(document.createTextNode('이 활동은 역사적 사건과 그 피해를 다룹니다. 관련해 마음이 무겁거나 이야기하고 싶은 점이 있다면, 담임·상담 선생님과 나눠 보는 것도 좋습니다.'));

    ROOT.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ─── 제출(GAS) ───
  var hasSubmitted = false;
  function submitToSheet() {
    var statusEl = $('hwt-submit-status');
    var btn = $('hwt-btn-submit');

    if (!GAS_URL || GAS_URL.indexOf('붙여넣기') !== -1) {
      statusEl.style.color = 'var(--hwt-mark)';
      statusEl.textContent = '아직 GAS 주소가 설정되지 않았어요. (코드 상단 GAS_URL 확인)';
      return;
    }
    if (hasSubmitted && !window.confirm('이미 제출했어요. 다시 제출할까요?')) return;

    var info = state.studentInfo;
    var sno = info.grade + String(info.class).padStart(2, '0') + String(info.num).padStart(2, '0');
    var choices = state.log.map(function (l, i) {
      return '[조사' + (i + 1) + '] ' + l.choiceText + '\n  → 내 생각: ' + (l.reasonText || '');
    }).join('\n\n');

    var payload = {
      학번: sno, 학년: info.grade, 반: info.class, 번호: info.num, 이름: info.name,
      선택과생각: choices,
      성찰1: ($('hwt-reflect-1').value || '').trim(),
      성찰2: ($('hwt-reflect-2').value || '').trim(),
      성찰3: ($('hwt-reflect-3').value || '').trim()
    };

    btn.disabled = true;
    statusEl.style.color = 'var(--hwt-muted)';
    statusEl.textContent = '제출하는 중…';

    // text/plain 전송 → CORS 사전요청(preflight) 회피
    fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) })
      .then(function () {
        hasSubmitted = true;
        statusEl.style.color = '#2f7d4f';
        statusEl.textContent = '✅ 제출 완료! 선생님 시트에 저장되었습니다.';
      })
      .catch(function (err) {
        statusEl.style.color = 'var(--hwt-mark)';
        statusEl.textContent = '제출 실패: ' + err + ' (인터넷 · GAS 배포 권한 "모든 사용자" 확인)';
      })
      .then(function () { btn.disabled = false; });
  }

  function printReport() { window.print(); }

  function restartGame() {
    if (!window.confirm('처음으로 돌아갈까요? 지금까지의 조사 기록은 사라집니다.')) return;
    try { sessionStorage.removeItem('hwt_state'); } catch (e) {}
    state = JSON.parse(JSON.stringify(initial));
    $('hwt-screen-result').style.display = 'none';
    $('hwt-screen-game').style.display = 'none';
    $('hwt-screen-title').style.display = 'block';
    ['hwt-info-grade', 'hwt-info-class', 'hwt-info-num', 'hwt-info-name'].forEach(function (id) { $(id).value = ''; });
    ['hwt-reflect-1', 'hwt-reflect-2', 'hwt-reflect-3'].forEach(function (id) { var el = $(id); if (el) el.value = ''; });
    hasSubmitted = false;
    var ss = $('hwt-submit-status'); if (ss) ss.textContent = '';
    checkFormReady();
    ROOT.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ═══════════════ 바인딩 ═══════════════
  renderFormatted($('hwt-title-desc'), TITLE_DESC);
  $('hwt-neutral-note').textContent = NEUTRAL_NOTE;

  ['hwt-info-grade', 'hwt-info-class', 'hwt-info-num', 'hwt-info-name'].forEach(function (id) {
    $(id).addEventListener('input', checkFormReady);
  });
  checkFormReady();

  $('hwt-btn-start').addEventListener('click', startGame);
  $('hwt-btn-send').addEventListener('click', sendReason);
  $('hwt-btn-next').addEventListener('click', proceedToNext);
  $('hwt-btn-restart').addEventListener('click', restartGame);
  $('hwt-btn-print').addEventListener('click', printReport);
  $('hwt-btn-submit').addEventListener('click', submitToSheet);

  var chatInput = $('hwt-chat-input');
  chatInput.addEventListener('input', function () {
    chatInput.style.height = 'auto';
    chatInput.style.height = chatInput.scrollHeight + 'px';
    $('hwt-btn-send').disabled = chatInput.value.trim().length === 0 || state.chatTurnDone;
  });
  chatInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!$('hwt-btn-send').disabled) sendReason();
    }
  });

})();
</script>
</div>
